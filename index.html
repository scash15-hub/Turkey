<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NY Rangers</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Arena effects -->
    <div class="arena-lights">
        <div class="spotlight spotlight-left"></div>
        <div class="spotlight spotlight-right"></div>
    </div>

    <!-- Floating ice particles -->
    <div class="ice-particles">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
    </div>

    <!-- Game day scoreboard -->
    <div class="scoreboard">
        <div class="game-status">● GAME DAY</div>
        <div class="score">
            <span>NYR</span>
            <strong>7 — 1</strong>
            <span>OPP</span>
        </div>
        <div class="period">3RD PERIOD</div>
    </div>

    <!-- Website heading -->
    <header>
        <p class="eyebrow">NEW YORK RANGERS • #73</p>
        <h1>NY Rangers</h1>
        <p class="subtitle">Matt Rempe • Forward</p>
    </header>

    <!-- Ice rink -->
    <div class="rink">
        <div class="center-line"></div>
        <div class="center-circle"></div>
    </div>

    <!-- Matt Rempe turkey -->
    <div class="turkey">

        <!-- Tail feathers -->
        <div class="tail"></div>
        <div class="tail"></div>
        <div class="tail"></div>
        <div class="tail"></div>
        <div class="tail"></div>
        <div class="tail"></div>
        <div class="tail"></div>
        <div class="tail"></div>
        <div class="tail"></div>
        <div class="tail"></div>
        <div class="tail"></div>

        <!-- Legs -->
        <div class="leg"></div>
        <div class="leg"></div>

        <!-- Ice skates -->
        <div class="skate skate-left"></div>
        <div class="skate skate-right"></div>

        <!-- Rangers jersey -->
        <div class="body">
            <div class="collar"></div>
            <div class="jersey-name">REMPE</div>
            <div class="jersey-number">73</div>
            <div class="jersey-stripe"></div>
        </div>

        <!-- Jersey sleeves -->
        <div class="wing"></div>
        <div class="wing"></div>

        <!-- Turkey face -->
        <div class="head">
            <div class="eye"></div>
            <div class="beak"></div>
            <div class="red"></div>
        </div>

        <!-- Hockey helmet -->
        <div class="hat-top">
            <span>73</span>
        </div>

        <div class="hat-bottom"></div>
        <div class="visor"></div>

        <!-- Hockey equipment -->
        <div class="stick"></div>
        <div class="glove"></div>
        <div class="puck"></div>

        <!-- Animated skating effects -->
        <div class="ice-spray"></div>
        <div class="ice-shadow"></div>

    </div>

    <!-- Footer -->
    <footer>
        <span>NY RANGERS</span>
        <span class="footer-number">73</span>
        <span>LET'S GO RANGERS</span>
    </footer>

</body>

</html>
